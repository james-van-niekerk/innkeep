# Colours as hex strings, e.g. "#4c8fd6". Leave empty ("") to use the default.
theme:
  bg: ""
  panelBg: ""
  border: ""
  borderFocus: ""
  text: ""
  textDim: ""
  accent: ""
  statusBg: ""
